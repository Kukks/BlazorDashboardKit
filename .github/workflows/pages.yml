name: Pages

# Publishes the standalone Blazor WebAssembly sample (live demo + usage docs)
# to GitHub Pages on every push to main.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish standalone WASM sample
        run: dotnet publish samples/StandaloneWasm/StandaloneWasm.csproj -c Release -o ./publish

      - name: Rewrite base href for the project Pages sub-path
        run: |
          sed -i 's|<base href="/" />|<base href="/BlazorDashboardKit/" />|' ./publish/wwwroot/index.html

      - name: SPA fallback + disable Jekyll
        run: |
          cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html
          touch ./publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
