<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorDashboardKit</title>
    <base href="/" />
    <link rel="icon" href="data:," />
    <!-- Bootstrap (demo styling only — the kit itself ships its own themeable CSS). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="app.css" />
    <!-- BlazorDashboardKit's CSS + GridStack are injected by its JS initializer. -->
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#666">
            Loading BlazorDashboardKit…
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#b32d2e;color:#fff;padding:.6rem 1rem">
        An unhandled error has occurred. <a href="." class="reload" style="color:#fff;text-decoration:underline">Reload</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
